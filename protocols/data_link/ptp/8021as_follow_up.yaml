#
# IEEE 802.1AS-2011  11.4.4: Follow_Up message, 76 bytes — the common
# header, preciseOriginTimestamp, and the MANDATORY Follow_Up
# information TLV (11.4.4.3).
#
#   Bits  Field                          802.1AS-2011 reference
#   34-byte common header                10.5.2 / Table 10-4
#   48    precise_origin_seconds         11.4.4.2.1
#   32    precise_origin_ns
#   16    tlv_type            = 0x0003   11.4.4.3.2 (ORGANIZATION_EXTENSION)
#   16    tlv_length          = 28       11.4.4.3.3
#   24    tlv_org_id          = 0x0080C2 11.4.4.3.4
#   24    tlv_org_subtype     = 1        11.4.4.3.5
#   32    cumulative_scaled_rate_offset  11.4.4.3.6
#   16    gm_time_base_indicator         11.4.4.3.7
#   32    last_gm_phase_change_hi        11.4.4.3.8 (ScaledNs 96b,
#   64    last_gm_phase_change_lo         split: a 96b var truncates to 64)
#   32    scaled_last_gm_freq_change     11.4.4.3.9
#        ──────────
#      = 608 bits = 76 bytes

service: as_follow_up

vars:
  - var: transport_specific
    size: 4
    expected:
      value: 1

  - var: message_type
    size: 4
    expected:
      value: 0x8

  - var: reserved0
    size: 4
    expected:
      value: 0

  - var: version_ptp
    size: 4
    expected:
      value: 2

  - var: message_length
    size: 16
    expected:
      value: 76

  - var: domain_number
    size: 8
    expected:
      value: 0

  - var: reserved1
    size: 8
    expected:
      value: 0

  # 11.4.2.3 overrides 10.5.2.2.6 for the five media-dependent messages, and
  # Table 11-4 defines ONLY twoStepFlag for them: "for message types where the
  # bit is not defined ... the value of the bit is set to FALSE" gives 0x0000
  # here. 802.1AS-2020 Table 10-9 confirms that reading by re-scoping
  # ptpTimescale to Announce only. Deployed stacks (this project's included)
  # nonetheless set it, so BOTH are accepted: an oracle that pinned one would
  # fail a conformant device for the other's choice. The three Pdelay messages
  # keep a single strict pin because no deployed practice sets ptpTimescale on
  # them (this project's own engine emits 0x0000 / 0x0200 / 0x0000); if one
  # appears, the same relaxation applies there for the same reason.
  - var: flags
    size: 16
    expected:
      values: [0x0000, 0x0008]  # twoStep clear; ptpTimescale per 11.4.2.3 vs 10.5.2.2.6

  - var: correction_field
    size: 64

  - var: reserved2
    size: 32
    expected:
      value: 0

  - var: source_clock_identity
    size: 64

  - var: source_port_number
    size: 16
    expected:
      range: [1, 65534]   # 1588-2008 7.5.2.3 reserves 0 and 0xFFFF

  - var: sequence_id
    size: 16

  - var: control
    size: 8
    expected:
      value: 0x02              # Table 11-7 (11.4.2.7)

  - var: log_message_interval
    size: 8
    expected:
      value: 0xFD              # carries the sync interval, Milan -3

  - var: precise_origin_seconds
    size: 48

  - var: precise_origin_ns
    size: 32
    expected:
      range: [0, 999999999]

  - var: tlv_type
    size: 16
    expected:
      value: 0x0003

  - var: tlv_length
    size: 16
    expected:
      value: 28

  - var: tlv_org_id
    size: 24
    expected:
      value: 0x0080C2

  - var: tlv_org_subtype
    size: 24
    expected:
      value: 1

  - var: cumulative_scaled_rate_offset
    size: 32

  - var: gm_time_base_indicator
    size: 16

  # lastGmPhaseChange is a 96-bit ScaledNs (11.4.4.3.8). The generator and the
  # decoder both carry a field in a 64-bit word, so a single 96-bit var loses
  # its top 32 bits SILENTLY in both directions -- and this field is nonzero on
  # every grandmaster change, so the loss is not theoretical. Split it the same
  # way this file already splits Timestamp (48 + 32) and PortIdentity (64 + 16).
  - var: last_gm_phase_change_hi
    size: 32

  - var: last_gm_phase_change_lo
    size: 64

  - var: scaled_last_gm_freq_change
    size: 32

entities:
  - entity: AS_FOLLOW_UP
    interfaces:
      - interface: AS_FOLLOW_UP_IF
        dir: out
        vars:
          - var_ref: transport_specific
          - var_ref: message_type
          - var_ref: reserved0
          - var_ref: version_ptp
          - var_ref: message_length
          - var_ref: domain_number
          - var_ref: reserved1
          - var_ref: flags
          - var_ref: correction_field
          - var_ref: reserved2
          - var_ref: source_clock_identity
          - var_ref: source_port_number
          - var_ref: sequence_id
          - var_ref: control
          - var_ref: log_message_interval
          - var_ref: precise_origin_seconds
          - var_ref: precise_origin_ns
          - var_ref: tlv_type
          - var_ref: tlv_length
          - var_ref: tlv_org_id
          - var_ref: tlv_org_subtype
          - var_ref: cumulative_scaled_rate_offset
          - var_ref: gm_time_base_indicator
          - var_ref: last_gm_phase_change_hi
          - var_ref: last_gm_phase_change_lo
          - var_ref: scaled_last_gm_freq_change
