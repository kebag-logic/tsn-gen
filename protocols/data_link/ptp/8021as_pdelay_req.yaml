#
# IEEE 802.1AS-2011  11.4.5: Pdelay_Req message, 54 bytes.
#
#   Bits  Field                          802.1AS-2011 reference
#   34-byte common header                10.5.2 / Table 10-4
#   80    reserved3            = 0       11.4.5 / Table 11-11 (reserved)
#   80    reserved4            = 0       11.4.5 / Table 11-11 (reserved)
#        ──────────
#      = 432 bits = 54 bytes

service: as_pdelay_req

vars:
  - var: transport_specific
    size: 4
    expected:
      value: 1

  - var: message_type
    size: 4
    expected:
      value: 0x2

  - var: reserved0
    size: 4
    expected:
      value: 0

  - var: version_ptp
    size: 4
    expected:
      value: 2

  - var: message_length
    size: 16
    expected:
      value: 54

  - var: domain_number
    size: 8
    expected:
      value: 0

  - var: reserved1
    size: 8
    expected:
      value: 0

  - var: flags
    size: 16
    expected:
      value: 0x0000

  # NOT pinned to zero: Table 11-5 explicitly assigns Pdelay_Req the
  # "corrections for fractional nanoseconds" role, so a conformant requester
  # may carry a nonzero correctionField. (Sync pins 0 because Sync is absent
  # from Table 11-5, leaving 10.5.2.2.7 "The value is 0" to govern.)
  - var: correction_field
    size: 64

  - var: reserved2
    size: 32
    expected:
      value: 0

  - var: source_clock_identity
    size: 64

  - var: source_port_number
    size: 16
    expected:
      range: [1, 65534]   # 1588-2008 7.5.2.3 reserves 0 and 0xFFFF

  - var: sequence_id
    size: 16

  - var: control
    size: 8
    expected:
      value: 0x05              # Table 11-7 (11.4.2.7)

  - var: log_message_interval
    size: 8
    expected:
      value: 0x00              # Milan v1.2 Table 4.1: 1 s

  - var: reserved3
    size: 80
    expected:
      value: 0

  - var: reserved4
    size: 80
    expected:
      value: 0

entities:
  - entity: AS_PDELAY_REQ
    interfaces:
      - interface: AS_PDELAY_REQ_IF
        dir: out
        vars:
          - var_ref: transport_specific
          - var_ref: message_type
          - var_ref: reserved0
          - var_ref: version_ptp
          - var_ref: message_length
          - var_ref: domain_number
          - var_ref: reserved1
          - var_ref: flags
          - var_ref: correction_field
          - var_ref: reserved2
          - var_ref: source_clock_identity
          - var_ref: source_port_number
          - var_ref: sequence_id
          - var_ref: control
          - var_ref: log_message_interval
          - var_ref: reserved3
          - var_ref: reserved4
